<article class="card">
  <div class="card__avatar-wrapper">
    <img
      class="card__avatar"
      [src]="user.avatarUrl || 'https://i.pravatar.cc/150?img=0'"
      [alt]="user.name + ' avatar'"
      loading="lazy"
    />
  </div>
  <div class="card__body">
    <h2 class="card__name">{{ user.name }}</h2>
    <a class="card__email" [href]="'mailto:' + user.email">{{ user.email }}</a>
    <p class="card__bio">{{ user.bio }}</p>
  </div>
</article>
